name: Backend Tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flask flask-cors flask-sqlalchemy flask-jwt-extended \
                      sqlalchemy watchdog requests pyjwt pytest || true

      - name: Run backend unit & integration tests
        working-directory: ${{ github.workspace }}
        run: |
          python -m unittest -v \
            tests.test_backend_helpers \
            tests.test_runtime \
            tests.test_helpers_integration
