name: Tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flask flask-cors flask-sqlalchemy flask-jwt-extended \
                      sqlalchemy watchdog requests pyjwt pytest pyzmq || true

      - name: Run backend unit & integration tests
        working-directory: ${{ github.workspace }}
        run: |
          python -m unittest -v \
            tests.test_backend_helpers \
            tests.test_runtime \
            tests.test_helpers_integration \
            tests.test_runtime_injection \
            tests.test_app_import

      # ServiceBus 集成测试为自定义入口（非 unittest 用例），需以脚本方式直接运行
      - name: Run ServiceBus integration tests
        working-directory: ${{ github.workspace }}
        run: |
          python tests/test_servicebus.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/webui
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Type check
        run: npx vue-tsc --noEmit

      - name: Build
        run: npm run build

      - name: Run frontend API mock tests
        run: npx vitest run
