<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AI 助手</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Segoe UI", "PingFang SC", sans-serif; background: #f7f8fa; color: #1f2329; height: 100%; }
  .wrap { display: flex; flex-direction: column; height: 100vh; }
  .toolbar { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; border-bottom: 1px solid #e3e6eb; background: #fff; }
  .toolbar .title { font-weight: 600; font-size: 14px; }
  .toolbar button { background: none; border: 1px solid #d0d4dc; color: #888; border-radius: 6px; font-size: 12px; padding: 3px 10px; cursor: pointer; }
  .toolbar button:hover { color: #4f8cff; border-color: #4f8cff; }
  .toolbar .tools { display: flex; gap: 8px; }

  .queue { background: #fff; border-bottom: 1px solid #e3e6eb; padding: 8px 12px; font-size: 13px; }
  .queue .qhead { display: flex; align-items: center; gap: 8px; color: #555; font-weight: 600; margin-bottom: 6px; }
  .queue .qempty { color: #aaa; font-size: 12px; padding: 2px 0; }
  .qitem { display: flex; align-items: center; gap: 8px; padding: 4px 0; border-top: 1px dashed #eee; }
  .qitem:first-of-type { border-top: none; }
  .qbadge { font-size: 11px; padding: 1px 7px; border-radius: 10px; white-space: nowrap; }
  .b-running { background: #e6f4ea; color: #1a7f37; }
  .b-pending { background: #fff4e5; color: #b26a00; }
  .qtext { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #333; }
  .qtime { font-size: 11px; color: #aaa; white-space: nowrap; }
  .qdel { border: none; background: #ffe9e9; color: #d33; border-radius: 6px; font-size: 12px; padding: 2px 8px; cursor: pointer; }
  .qdel:hover { background: #ffd6d6; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #1a7f37; display: inline-block; animation: pulse 1s infinite; }
  @keyframes pulse { 0%{opacity:1} 50%{opacity:.3} 100%{opacity:1} }

  .msgs { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  .expand { text-align: center; margin-bottom: 4px; flex-shrink: 0; }
  .expand button { border: 1px solid #d0d4dc; background: #fff; color: #4f8cff; border-radius: 14px; font-size: 12px; padding: 3px 14px; cursor: pointer; }
  .bubble { max-width: 82%; padding: 8px 12px; border-radius: 12px; font-size: 14px; line-height: 1.5; word-break: break-word; white-space: pre-wrap; flex-shrink: 0; }
  .me { align-self: flex-end; background: #4f8cff; color: #fff; border-bottom-right-radius: 4px; }
  .ai { align-self: flex-start; background: #e9ebf0; color: #1f2329; border-bottom-left-radius: 4px; }
  .ai .aistatus { display: inline-block; font-size: 11px; color: #1a7f37; margin-left: 6px; }
  .ai.err { background: #ffe9e9; color: #b00; }
  .ai.pending { color: #999; font-style: italic; }
  /* 分阶段进度：AI 处理期间在回复气泡顶部展示处理阶段列表，最后一项为「进行中」高亮 */
  .stage-list { margin-bottom: 6px; padding: 5px 9px; background: rgba(79,140,255,.06); border-radius: 8px; }
  .stage-line { font-size: 12px; color: #5a6472; display: flex; align-items: center; gap: 6px; padding: 1px 0; line-height: 1.5; }
  .stage-dot { width: 7px; height: 7px; border-radius: 50%; background: #1a7f37; flex-shrink: 0; }
  .stage-line.done { color: #6b7280; }
  .stage-line.done .stage-dot { background: #1a7f37; }
  .stage-line.current { color: #2f6fd0; font-weight: 600; }
  .stage-line.current .stage-dot { background: #4f8cff; animation: pulse 1s infinite; }
  /* 阶段结论：某阶段完成（不再是「进行中」）后，在其下缩进展示该阶段结论，
     如「判断结果：这是一条【缺陷】反馈」，使判断等阶段的结论被明确回复发到聊天窗口。 */
  .stage-conclusion { font-size: 11.5px; color: #1a7f37; padding: 1px 0 3px 15px; line-height: 1.5; }
  .pending-hint { color: #999; font-style: italic; }
  /* 分阶段回复：宿主在各处理阶段产出的可见结论，作为助手回答的一部分穿插呈现，
     与上方进度列表区分（进度列表是「正在做什么」，这里是「本阶段得出的结论」）。 */
  .ai-step { font-size: 13px; color: #2f3a4a; background: rgba(79,140,255,.08); border-left: 3px solid #4f8cff; padding: 5px 10px; margin: 6px 0; border-radius: 4px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
  /* 每条 AI 气泡前带一个头像；AI 思考/执行时头像外圈出现旋转光环，直观提示“正在处理” */
  .ai-row { display: flex; align-items: flex-start; gap: 8px; align-self: flex-start; max-width: 82%; position: relative; }
  /* 聊天气泡下方的「复制」按钮：每条用户消息与 AI 回复下方各有一个，常驻可见，点击复制该条整段消息 */
  .copy-bar { display: flex; gap: 6px; margin-top: -4px; align-self: flex-start; }
  .copy-bar.right { align-self: flex-end; }
  .copy-btn { border: 1px solid #d0d4dc; background: #fff; color: #888; border-radius: 6px; font-size: 11px;
    padding: 1px 9px; cursor: pointer; user-select: none; transition: color .15s, border-color .15s; }
  .copy-btn:hover { color: #4f8cff; border-color: #4f8cff; }
  .copy-btn.copied { color: #1a7f37; border-color: #1a7f37; }
  .ai-row .bubble.ai { flex: 1 1 auto; flex-shrink: 1; max-width: 100%; }
  .ai-avatar { position: relative; width: 26px; height: 26px; border-radius: 50%; background: #4f8cff; color: #fff;
               display: flex; align-items: center; justify-content: center; font-size: 13px; flex-shrink: 0; margin-top: 2px; }
  .ai-avatar.running::after { content: ''; position: absolute; inset: -3px; border-radius: 50%;
               border: 2px solid transparent; border-top-color: #4f8cff; animation: ai-spin 1s linear infinite; }
  @keyframes ai-spin { to { transform: rotate(360deg); } }
  /* 过长消息折叠：仅显示部分，底部渐隐 + “展开全部/收起”按钮；不影响流式输出（running）气泡。
     max-height 由 JS 按行高对齐到整行设置，mask 仅对最后约 2 行做柔和淡出，
     使截断落在行边界、淡出自然，避免“截断在半行/显示不全”的突兀感。 */
  .bubble.ai.collapsed {
    overflow: hidden;
    -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 28px), transparent);
    mask-image: linear-gradient(to bottom, #000 calc(100% - 28px), transparent);
  }
  .ai-fold { text-align: center; margin: -4px 0 2px; flex-shrink: 0; }
  .ai-fold button { border: 1px solid #d0d4dc; background: #fff; color: #4f8cff; border-radius: 14px; font-size: 12px; padding: 3px 14px; cursor: pointer; }
  .ai-fold button:hover { border-color: #4f8cff; }
  .time { align-self: center; font-size: 11px; color: #b0b4bb; margin: 2px 0; user-select: none; flex-shrink: 0; }

  .input-bar { display: flex; gap: 8px; padding: 10px; border-top: 1px solid #e3e6eb; background: #fff; }
  .input-bar textarea { flex: 1; resize: none; min-height: 40px; max-height: 200px; overflow-y: auto; border: 1px solid #d0d4dc; border-radius: 8px; padding: 8px 10px; font-size: 14px; font-family: inherit; line-height: 1.4; box-sizing: border-box; }
  .input-bar button { background: #4f8cff; color: #fff; border: none; border-radius: 8px; padding: 0 16px; font-size: 14px; cursor: pointer; }
  .input-bar button:disabled { opacity: .5; cursor: not-allowed; }
  .hint { font-size: 12px; color: #888; text-align: center; padding: 10px; }

  /* Markdown 渲染样式（仅作用于 AI 回复气泡，强于 .bubble 的 pre-wrap） */
  .bubble.ai.md { white-space: normal; word-break: break-word; }
  .bubble.ai.md > :first-child { margin-top: 0; }
  .bubble.ai.md > :last-child { margin-bottom: 0; }
  .bubble.ai.md p { margin: 0 0 6px; }
  .bubble.ai.md .md-h { margin: 8px 0 4px; font-weight: 700; }
  .bubble.ai.md .md-h:first-child { margin-top: 0; }
  .bubble.ai.md ul.md-list, .bubble.ai.md ol.md-list { margin: 4px 0; padding-left: 22px; }
  .bubble.ai.md li { margin: 2px 0; }
  .bubble.ai.md .md-quote { margin: 4px 0; padding: 2px 10px; border-left: 3px solid #c0c4cc; color: #555; background: rgba(0,0,0,.04); }
  .bubble.ai.md .md-code { margin: 6px 0; padding: 8px 10px; background: #2b2f36; color: #e6e6e6; border-radius: 6px; overflow-x: auto; font-size: 12.5px; line-height: 1.45; white-space: pre; }
  .bubble.ai.md code.md-inline { background: #d8dce3; padding: 1px 5px; border-radius: 4px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12.5px; color: #c0331d; }
  .bubble.ai.md a { color: #2f6fd0; text-decoration: underline; }
  /* 反馈单引用：#单号 渲染为可点击链接，点击跳转反馈中心对应详情 */
  .bubble.ai   .fb-ref { color: #2f6fd0; background: #eaf2ff; border-radius: 4px; padding: 0 4px; cursor: pointer; text-decoration: none; font-weight: 600; }
  .bubble.ai .fb-ref:hover { background: #d6e6ff; }
  /* 资源引用：AI 回复中可点击跳转资源详情页的卡片式胶囊 */
  .bubble.ai .res-ref { display: inline-flex; align-items: center; gap: 4px; max-width: 100%;
    background: #eef3ff; color: #2f54eb; border: 1px solid #d6e0ff; border-radius: 6px;
    padding: 1px 8px; margin: 0 2px; cursor: pointer; font-weight: 600; text-decoration: none; vertical-align: middle; }
  .bubble.ai .res-ref:hover { background: #dde7ff; }
  .bubble.ai .res-ref .rr-ico { font-size: 12px; line-height: 1; }
  .bubble.ai .res-ref .rr-cover { width: 22px; height: 22px; border-radius: 4px; object-fit: cover; }
  .bubble.ai .res-ref .rr-type { font-size: 10px; color: #1a7f37; background: #e8f5e9; border-radius: 4px; padding: 0 4px; }
  .bubble.ai .res-ref.missing { background: #fbeaea; color: #b00; border-color: #f3c2c2; cursor: default; }
  .fbhint { font-size: 11.5px; color: #9aa0a6; text-align: center; padding: 4px 10px 0; user-select: none; }
</style>
</head>
<body>
<div class="wrap">
  <div class="toolbar">
    <span class="title">AI 助手</span>
    <div class="tools">
      <button id="toggleAll">收起全部</button>
      <button id="fullscreenBtn" title="全屏对话：在独立页面打开，独享整个界面">全屏对话</button>
      <button id="clear">清空对话</button>
    </div>
  </div>
  <div class="queue" id="queue"></div>
  <div class="msgs" id="msgs"></div>
  <div class="fbhint" id="fbhint">可在此提交 bug / 建议，AI 会自动建单并在反馈中心跟踪</div>
  <div class="input-bar">
    <textarea id="txt" placeholder="输入消息… (Enter 发送)"></textarea>
    <button id="send">发送</button>
  </div>
</div>
<script>
  // 面板 iframe 与宿主同源（sandbox 开启 allow-same-origin），
  // 优先直接读取 localStorage 中的 access token，避免 postMessage 注入竞态导致 token 为空触发 401。
  function readToken() {
    try {
      return localStorage.getItem('token')
        || localStorage.getItem('access_token')
        || sessionStorage.getItem('token') || '';
    } catch (e) { return ''; }
  }
  let TOKEN = readToken();
  window.addEventListener('message', (e) => {
    if (!e.data) return;
    if (e.data.type === 'DBOX_TOKEN' && e.data.token) { TOKEN = e.data.token; }
    // 宿主回填上次收起时未发送的输入内容（面板重新挂载后恢复草稿）
    if (e.data.type === 'DBOX_DRAFT' && typeof e.data.text === 'string') {
      if (!txt.value) { txt.value = e.data.text; autoGrow(); }
    }
    // 宿主通知当前为全屏独立模式（由 /ai-chat 全屏页加载时发送）：此时「全屏对话」
    // 按钮无意义，隐藏之；悬浮面板模式不会收到此消息，按钮正常显示。
    if (e.data.type === 'DBOX_MODE') {
      if (fullscreenBtn) fullscreenBtn.style.display = e.data.fullscreen ? 'none' : '';
    }
  });
  window.parent.postMessage({ type: 'DBOX_REQUEST_TOKEN', extId: 'ai_chat' }, '*');

  const queueEl = document.getElementById('queue');
  const msgs = document.getElementById('msgs');
  const txt = document.getElementById('txt');
  const send = document.getElementById('send');
  const clearBtn = document.getElementById('clear');
  const toggleAllBtn = document.getElementById('toggleAll');
  const fullscreenBtn = document.getElementById('fullscreenBtn');

  // UI 无状态：不本地保存历史、不上传历史。所有状态以服务端为准，仅做渲染与下发。
  // state 仅用于前端渲染；刷新或重开面板会重新从服务端拉取完整状态。
  let state = { pending: [], active: null, history: [], has_more: false,
                older: [], nextCursor: null, canExpand: false };
  let collapsedAllMode = false; // true 时强制折叠全部 AI 气泡（收起全部）；false 时仅长消息默认折叠
  const subscribed = new Set();   // 已在 SSE 订阅中的 task_id（避免重复订阅）
  const liveRender = {};          // 正在流式输出的任务 id -> 已渲染的「分阶段」HTML；
                                  // 供 2 秒轮询重绘时复用，避免被 list_tasks 返回的原始 token
                                  // 缓冲（不含 stage/step）覆盖掉 SSE 渲染的分阶段进度与结论。
  const expandedIds = new Set();  // 用户已手动展开过的对话 id，跨重绘保留展开态
  let pollTimer = null;
  const COLLAPSE_LINES = 6;       // 单条长消息默认折叠时展示的行数（按行高对齐到整行，足够看清大意）
  const COLLAPSE_ALL_LINES = 4;   // “收起全部”时每条 AI 气泡的预览行数（紧凑概览，但仍保留内容提示）

  function api(path, opts) {
    const headers = { 'Content-Type': 'application/json' };
    if (TOKEN) headers['Authorization'] = 'Bearer ' + TOKEN;
    return fetch(path, Object.assign({ headers }, opts || {}));
  }

  function esc(s) {
    return (s == null ? '' : String(s))
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  // ---------- Markdown 渲染（轻量、无外部依赖，适配离线环境） ----------
  // 仅对 AI 回复做 Markdown 解析；先转义再按规则生成受控的安全标签，避免 XSS。
  function sanitizeUrl(u) {
    u = (u || '').trim();
    if (/^(https?:|mailto:|#|\/)/i.test(u)) return u.replace(/"/g, '%22');
    return '#';
  }
  // 块级解析：围栏代码块、标题、引用、列表、分隔线、段落（行内内容再经 inlineMd 处理）。
  // 注意：HTML 特殊字符已先转义，故引用标记在源码里表现为 &gt;。
  function mdToHtml(src) {
    if (src == null) return '';
    src = String(src);
    const fences = [];
    src = src.replace(/```([^\n`]*)?\n?([\s\S]*?)```/g, function (m, lang, code) {
      const id = fences.length;
      fences.push({ lang: (lang || '').trim(), code: (code || '').replace(/\n$/, '') });
      return 'FENCE' + id + '';
    });
    src = esc(src);
    const lines = src.split('\n');
    const out = [];
    let listType = null;
    let para = [];
    const flushPara = function () {
      if (para.length) { out.push('<p>' + inlineMd(para.join('\n')) + '</p>'); para = []; }
    };
    const closeList = function () {
      if (listType) { out.push('</' + listType + '>'); listType = null; }
    };
    let i = 0;
    while (i < lines.length) {
      const line = lines[i];
      const fm = line.match(/^FENCE(\d+)$/);
      if (fm) {
        flushPara(); closeList();
        const f = fences[+fm[1]];
        out.push('<pre class="md-code"><code>' + esc(f.code) + '</code></pre>');
        i++; continue;
      }
      if (/^\s*([-*_])\1{2,}\s*$/.test(line)) { flushPara(); closeList(); out.push('<hr/>'); i++; continue; }
      const hm = line.match(/^(#{1,6})\s+(.*)$/);
      if (hm) { flushPara(); closeList(); const lvl = hm[1].length; out.push('<h' + lvl + ' class="md-h">' + inlineMd(hm[2]) + '</h' + lvl + '>'); i++; continue; }
      if (/^&gt;\s?/.test(line)) {
        flushPara(); closeList();
        const quote = [];
        while (i < lines.length && /^&gt;\s?/.test(lines[i])) { quote.push(lines[i].replace(/^&gt;\s?/, '')); i++; }
        out.push('<blockquote class="md-quote">' + inlineMd(quote.join('\n')) + '</blockquote>');
        continue;
      }
      const ulm = line.match(/^\s*[-*+]\s+(.*)$/);
      const olm = line.match(/^\s*\d+\.\s+(.*)$/);
      if (ulm || olm) {
        flushPara();
        const type = ulm ? 'ul' : 'ol';
        if (listType && listType !== type) { closeList(); }
        if (!listType) { out.push('<' + type + ' class="md-list">'); listType = type; }
        out.push('<li>' + inlineMd(ulm ? ulm[1] : olm[1]) + '</li>');
        i++; continue;
      }
      if (/^\s*$/.test(line)) { flushPara(); closeList(); i++; continue; }
      para.push(line); i++;
    }
    flushPara(); closeList();
    return out.join('');
  }
  // 行内解析：行内代码、粗体、斜体、链接；换行转 <br>
  function inlineMd(text) {
    const codes = [];
    text = text.replace(/`([^`]+)`/g, function (m, c) { const id = codes.length; codes.push(c); return 'C' + id + ''; });
    text = text.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    text = text.replace(/__([^_]+)__/g, '<strong>$1</strong>');
    text = text.replace(/\*([^*]+)\*/g, '<em>$1</em>');
    text = text.replace(/_([^_]+)_/g, '<em>$1</em>');
    text = text.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, function (m, t, u) {
      // 资源库引用：dbox://resource/<类型>/<标识> -> 可点击跳转的资源卡片胶囊
      if (/^dbox:\/\/resource\//.test(u)) {
        const seg = u.slice('dbox://resource/'.length).split('/');
        const rtype = seg.shift() || '';
        const rref = seg.join('/');
        return '<span class="res-ref" data-type="' + esc(rtype) + '" data-ref="' + esc(rref) + '">'
             + '<span class="rr-ico">' + typeIcon(rtype) + '</span>' + t + '</span>';
      }
      const safe = sanitizeUrl(u);
      return '<a href="' + safe + '" target="_blank" rel="noopener noreferrer">' + t + '</a>';
    });
    text = text.replace(/C(\d+)/g, function (m, n) { return '<code class="md-inline">' + codes[+n] + '</code>'; });
    text = text.replace(/\n/g, '<br>');
    return text;
  }

  // 资源类型对应的图标与中文标签
  function typeIcon(type) {
    if (type === 'video') return '🎬';
    if (type === 'gallery') return '🖼️';
    if (type === 'post') return '📝';
    if (type === 'text') return '📄';
    return '🔗';
  }
  function typeLabel(type) {
    return ({ video: '视频', gallery: '图集', post: '帖子', text: '文本' })[type] || type;
  }

  // 剥离 AI 回复中的 feedback-request 围栏块（提单指令，不应向用户展示原始 JSON）
  function stripFeedbackBlock(src) {
    return (src || '').replace(/```feedback-request[\s\S]*?```/g, '').trim();
  }

  // 将回复中的反馈单引用（# + 12 位数字，如 #202608120001）渲染为可点击链接，
  // 点击后通知宿主跳转到反馈中心详情页。
  function linkifyFeedback(html) {
    return (html || '').replace(/#(\d{12})/g, function (m, id) {
      return '<a class="fb-ref" data-id="' + id + '" href="javascript:void(0)">#' + id + '</a>';
    });
  }

  // 渲染 AI 回复的标准管线：剥离提单块 -> Markdown -> 反馈单引用可点击 -> 兜底把残留的 dbox:// 资源裸链接转卡片
  function renderContent(src) {
    return resourceifyHtml(linkifyFeedback(mdToHtml(stripFeedbackBlock(src))));
  }

  // 兜底：模型可能不会严格按 [文字](dbox://resource/类型/标识) 的 Markdown 形式输出，
  // 而是直接给出裸 URL（如 dbox://resource/video/xxx）或放在代码块里。inlineMd 的链接规则
  // 只识别标准 Markdown 链接，漏掉这些情况会导致聊天里显示成原始文本。这里在最终 HTML 上
  // 做一次全局兜底：把仍残留的 dbox://resource/... 裸链接也渲染成可点击的资源卡片。
  // 已渲染成 <span class="res-ref"> 的内容不含完整 "dbox://resource/" 串（只有 data-type/data-ref），
  // 因此全局替换安全、不会重复包裹。
  function resourceifyHtml(html) {
    return (html || '').replace(/(dbox:\/\/resource\/([a-z]+)\/([^\s<)"'\]]+))/gi, function (m, full, type, ref) {
      type = type.toLowerCase();
      // 裸链接无显示名，先用类型标签占位，enrichResourceRefs 解析到真实标题后回填 .rr-title。
      return '<span class="res-ref" data-type="' + esc(type) + '" data-ref="' + esc(ref) + '">'
           + '<span class="rr-ico">' + typeIcon(type) + '</span>'
           + '<span class="rr-title">' + typeLabel(type) + '</span></span>';
    });
  }

  // 分阶段进度：把处理阶段列表渲染为带状态点的进度条（末项为「进行中」）。
  // stageAcc 为后端按处理顺序下发的阶段数据：新版本为 JSON（{text, state, conclusion}），
  // 旧版为纯文本，二者均兼容解析。非当前阶段若带 conclusion，则在其下展示该阶段结论
  // （如「判断结果：这是一条【缺陷】反馈」），即判断成功后回复本阶段结论。
  // allDone=true 时（任务已结束）所有阶段一律渲染为 done（绿色完成）。
  function stageHtml(stages, allDone) {
    if (!stages || !stages.length) return '';
    const last = stages.length - 1;
    const lines = stages.map((raw, i) => {
      let text = raw, conclusion = '';
      try {
        const o = JSON.parse(raw);
        if (o && typeof o === 'object') { text = o.text || raw; conclusion = o.conclusion || ''; }
      } catch (e) { /* 旧版纯文本阶段，无结论 */ }
      const isCur = (!allDone && i === last);
      const cls = isCur ? 'stage-line current' : 'stage-line done';
      let h = '<div class="' + cls + '"><span class="stage-dot"></span>' + esc(text) + '</div>';
      if (!isCur && conclusion) {
        h += '<div class="stage-conclusion">' + esc(conclusion) + '</div>';
      }
      return h;
    }).join('');
    return '<div class="stage-list">' + lines + '</div>';
  }

  // 将 Unix 秒级时间戳格式化为会话时间：今天显示 HH:mm，今年显示 M-D HH:mm，跨年显示 YYYY-M-D HH:mm
  function fmtTime(ts) {
    if (!ts && ts !== 0) return '';
    const d = new Date(ts * 1000);
    if (isNaN(d.getTime())) return '';
    const pad = n => (n < 10 ? '0' + n : '' + n);
    const hm = pad(d.getHours()) + ':' + pad(d.getMinutes());
    const now = new Date();
    const sameDay = d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth() && d.getDate() === now.getDate();
    if (sameDay) return hm;
    if (d.getFullYear() === now.getFullYear()) return (d.getMonth() + 1) + '-' + d.getDate() + ' ' + hm;
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + hm;
  }

  // 是否贴近底部（容差 40px）。用户手动上滑看历史时视为“未贴底”，
  // 此时不应把滚动条强制拉回底部，避免阅读中被打断。
  function nearBottom() {
    return msgs.scrollHeight - msgs.scrollTop - msgs.clientHeight <= 40;
  }
  function stickToBottom() {
    msgs.scrollTop = msgs.scrollHeight;
  }

  // 合并渲染数据：队列区 + 对话区
  function render() {
    renderQueue();
    renderMsgs();
  }

  function renderQueue() {
    const items = [];
    if (state.active) {
      items.push({ id: state.active.id, status: 'running', prompt: state.active.prompt, created_at: state.active.created_at });
    }
    state.pending.forEach(p => items.push({ id: p.id, status: 'pending', prompt: p.prompt }));

    if (!items.length) {
      queueEl.innerHTML = '<div class="qhead">任务队列</div><div class="qempty">暂无排队任务</div>';
      return;
    }
    let html = '<div class="qhead">任务队列（' + items.length + '）</div>';
    items.forEach((it, i) => {
      const isRun = it.status === 'running';
      const badge = isRun
        ? '<span class="dot"></span><span class="qbadge b-running">正在处理</span>'
        : '<span class="qbadge b-pending">排队 ' + (i + (state.active ? 0 : 1)) + '</span>';
      html += '<div class="qitem" data-id="' + esc(it.id) + '">'
            + badge
            + '<span class="qtext" title="' + esc(it.prompt) + '">' + esc(it.prompt) + '</span>'
            + (it.created_at != null ? '<span class="qtime">' + esc(fmtTime(it.created_at)) + '</span>' : '')
            + '<button class="qdel" data-del="' + esc(it.id) + '">删除</button>'
            + '</div>';
    });
    queueEl.innerHTML = html;
    queueEl.querySelectorAll('[data-del]').forEach(btn => {
      btn.addEventListener('click', () => deleteTask(btn.getAttribute('data-del')));
    });
  }

  function renderMsgs() {
    // 对话区：历史（倒序->正序）+ 正在处理 + 排队中，时间正序展示
    const allHistory = state.history.concat(state.older); // 均为新->旧
    const turns = [];
    for (let i = allHistory.length - 1; i >= 0; i--) {
      const h = allHistory[i];
      turns.push({ id: h.id, prompt: h.prompt,
                   reply: h.status === 'failed' ? ('执行失败：' + (h.error || ''))
                          : ((h.reply && h.reply.trim()) ? h.reply : '（任务已执行完成，无文本输出）'),
                   kind: h.status === 'failed' ? 'err' : 'done',
                   created_at: h.created_at });
    }
    if (state.active) {
      // 优先使用 SSE 订阅实时渲染的「分阶段」HTML（含顶部进度列表与阶段结论）；
      // 若 SSE 尚未建立 liveRender，但服务端已在 active.stages 中缓冲了阶段事件，
      // 则直接用它们 + 当前 token 缓冲渲染分阶段进度（避免只显示「正在处理」）。
      const live = liveRender[state.active.id];
      const st = state.active.stages || [];
      let replyHtml, isLive = !!live;
      if (live) {
        replyHtml = live;
      } else if (st.length) {
        const body = state.active.stream
          ? renderContent(state.active.stream)
          : '<div class="pending-hint">正在处理…</div>';
        replyHtml = stageHtml(st, false) + body;
        isLive = true;  // 已是渲染好的 HTML，renderMsgs 不再二次 Markdown 化
      } else {
        replyHtml = state.active.stream || '正在处理…';
      }
      turns.push({ id: state.active.id, prompt: state.active.prompt,
                   reply: replyHtml,
                   live: isLive, kind: 'running',
                   created_at: state.active.created_at });
    }
    state.pending.forEach(p => {
      turns.push({ id: p.id, prompt: p.prompt, reply: '排队中，等待处理…', kind: 'pending',
                   created_at: p.created_at });
    });

    let html = '';
    if (state.canExpand) {
      html += '<div class="expand"><button id="expandMore">展开更多</button></div>';
    }
    if (!turns.length) {
      html += '<div class="hint">发送消息开始与 AI 助手对话；任务由底层队列串行处理</div>';
    }
    turns.forEach(t => {
      const aiCls = 'ai md' + (t.kind === 'err' ? ' err' : (t.kind === 'pending' ? ' pending' : ''));
      const isRun = t.kind === 'running';
      const statusTag = isRun ? '<span class="aistatus">● 正在处理</span>' : '';
      const avatarGlyph = t.kind === 'err' ? '⚠' : '🤖';
      const timeLabel = (t.created_at != null) ? '<div class="time">' + esc(fmtTime(t.created_at)) + '</div>' : '';
      // 正在流式且已存在 SSE 渲染的分阶段 HTML 时，直接使用该 HTML（其已含 stage 列表与
      // step 结论），不再经 renderContent，避免对已完成渲染的 HTML 二次 Markdown 化而破坏结构。
      const bubbleInner = (isRun && t.live) ? (t.reply + statusTag) : (renderContent(t.reply) + statusTag);
      html += timeLabel
            + '<div class="bubble me">' + esc(t.prompt) + '</div>'
            + '<div class="ai-row" data-ai="' + esc(t.id) + '">'
            +   '<div class="ai-avatar' + (isRun ? ' running' : '') + '">' + avatarGlyph + '</div>'
            +   '<div class="bubble ' + aiCls + '" id="ai-' + esc(t.id) + '">'
            +      bubbleInner
            +   '</div>'
            + '</div>';
    });
    // 重绘前记录：用户是否贴底、当前滚动位置，重绘后据此决定是否拉回底部
    const pinToBottom = nearBottom();
    const prevScrollTop = msgs.scrollTop;
    msgs.innerHTML = html;
    const em = document.getElementById('expandMore');
    if (em) em.addEventListener('click', expandMore);
    // 先折叠过长气泡（在恢复滚动位置之前完成）：折叠会改变内容总高度，
    // 若放在 scrollTop 设定之后执行，浏览器会对 scrollTop 重新钳制到底部，造成“瞬移跳转”。
    applyCollapse();
    // 补全 AI 回复中资源引用的封面/标题/类型标签
    enrichResourceRefs();
    // 给每条用户消息与 AI 回复下方挂上「复制」按钮（重绘重建，无残留/重复）
    msgs.querySelectorAll('.bubble.me').forEach(b => addCopyBar(b, b, true));
    msgs.querySelectorAll('.ai-row').forEach(row => {
      const ai = row.querySelector('.bubble.ai');
      if (ai) addCopyBar(row, ai, false);
    });
    // 工具栏按钮文案随模式更新：收起全部模式显示“展开全部”，否则“收起全部”
    toggleAllBtn.textContent = collapsedAllMode ? '展开全部' : '收起全部';
    // 仅当用户原本就贴底时才自动贴底；否则保留当前滚动位置，避免用户在看历史时被拉回底部。
    if (pinToBottom) stickToBottom();
    else msgs.scrollTop = prevScrollTop;
  }

  // AI 聊天内容收起/展开：
  // - 默认仅对超过预览行数（COLLAPSE_LINES）的长消息折叠为“部分展示”，顶部保留若干行作为内容预览。
  // - collapsedAllMode 为 true 时（“收起全部”）所有 AI 气泡都按更小的预览行数（COLLAPSE_ALL_LINES）
  //   折叠成紧凑概览，但仍露出开头几行“意思一下”，不会整条消失。
  // - expandedIds 记录用户手动展开过的气泡：无论默认折叠还是收起全部，展开后都保持展开，跨重绘保留。
  // - 仅当内容确实超出预览高度时才挂折叠/展开按钮；短消息不强行折叠、也不显示多余按钮。
  // - 流式输出（running/pending）气泡不折叠。
  function applyCollapse() {
    msgs.querySelectorAll('.bubble.ai').forEach(node => {
      if (node.classList.contains('running') || node.classList.contains('pending')) return;
      const tid = node.id.slice(3);
      const lh = parseFloat(getComputedStyle(node).lineHeight) || 21;
      const previewLines = collapsedAllMode ? COLLAPSE_ALL_LINES : COLLAPSE_LINES;
      const maxH = Math.round(lh * previewLines);
      const needsFold = node.scrollHeight > maxH + 8; // 内容是否真的超出预览高度
      const userExpanded = expandedIds.has(tid);
      if (!userExpanded && needsFold) {
        // 折叠为部分展示：顶部预览若干行，底部柔和淡出 + “展开全部”
        node.classList.add('collapsed');
        node.style.maxHeight = maxH + 'px';
        addFold(node, '展开全部', () => {
          expandedIds.add(tid);
          renderMsgs();
        });
      } else {
        // 完整展示（短消息 / 已手动展开）：仅当内容超标时提供“收起”按钮
        node.classList.remove('collapsed');
        node.style.maxHeight = '';
        if (needsFold) {
          addFold(node, '收起', () => {
            expandedIds.delete(tid);
            renderMsgs();
          });
        }
      }
    });
  }

  // 在某条 AI 气泡后插入一个折叠/展开按钮（每次重绘 innerHTML 重建，无残留）
  function addFold(node, label, onClick) {
    const fold = document.createElement('div');
    fold.className = 'ai-fold';
    fold.innerHTML = '<button>' + esc(label) + '</button>';
    // node（气泡）位于 .ai-row 内，按钮应插到整行之后，避免与头像同行错位
    const row = node.closest('.ai-row') || node;
    row.after(fold);
    fold.querySelector('button').addEventListener('click', onClick);
  }

  // 复制某消息节点纯文本（剔除「正在处理」状态标签与占位提示），
  // 优先用 navigator.clipboard，失败回退 execCommand，兼容非安全上下文（http 面板）。
  // 用户消息与 AI 回复共用，分别传入各自的消息气泡节点即可。
  function copyNodeText(sourceNode, btn) {
    if (!sourceNode) return;
    const tmp = sourceNode.cloneNode(true);
    tmp.querySelectorAll('.aistatus').forEach(s => s.remove());
    let text = (tmp.innerText || '').replace(/●\s*正在处理/g, '')
                                 .replace(/正在处理…/g, '')
                                 .replace(/\n{2,}/g, '\n').trim();
    const flash = function () {
      const old = btn.textContent;
      btn.textContent = '已复制'; btn.classList.add('copied');
      setTimeout(() => { btn.textContent = old; btn.classList.remove('copied'); }, 1200);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(flash, () => fallbackCopy(text, flash));
    } else {
      fallbackCopy(text, flash);
    }
  }
  function fallbackCopy(text, flash) {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.top = '-1000px'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    try { if (document.execCommand('copy')) flash(); } catch (e) { /* ignore */ }
    document.body.removeChild(ta);
  }
  // 在某条消息气泡之后挂一个「复制」按钮条（气泡下方，常驻可见）：
  // isUser=true 时按钮条右对齐（与用户泡泡同侧），否则左对齐（与 AI 回复同侧）。
  function addCopyBar(afterNode, sourceNode, isUser) {
    if (!afterNode) return;
    if (afterNode.nextElementSibling && afterNode.nextElementSibling.classList.contains('copy-bar')) return;
    const bar = document.createElement('div');
    bar.className = 'copy-bar' + (isUser ? ' right' : '');
    const btn = document.createElement('button');
    btn.className = 'copy-btn';
    btn.textContent = '复制';
    btn.title = isUser ? '复制我的消息' : '复制 AI 回复';
    btn.addEventListener('click', (e) => { e.stopPropagation(); copyNodeText(sourceNode, btn); });
    bar.appendChild(btn);
    afterNode.after(bar);
  }

  // 直接更新某条正在流式输出的 AI 气泡（避免整页重渲染打断滚动）。
  // html 为已渲染内容（分阶段进度列表 + Markdown 化的流式回复），由调用方拼装。
  function updateAiLive(id, html, running) {
    const node = document.getElementById('ai-' + id);
    if (!node) { renderMsgs(); return; }
    // running 时追加“正在处理”状态标签
    const status = running ? '<span class="aistatus">● 正在处理</span>' : '';
    node.innerHTML = html + status;
    // 流式输出中也补全资源引用卡片（解析结果已缓存，不会重复请求）
    enrichResourceRefs();
    // AI 思考/执行中：头像外圈显示旋转光环；结束后移除
    const avatar = node.closest('.ai-row') && node.closest('.ai-row').querySelector('.ai-avatar');
    if (avatar) avatar.classList.toggle('running', !!running);
    // 仅在用户贴底时跟随流式输出滚动到底部；上滑看历史时不打断
    if (nearBottom()) stickToBottom();
  }

  // ---------- 数据拉取 ----------
  async function refresh() {
    try {
      const resp = await api('/api/ai-chat/tasks?limit=10');
      if (!resp.ok) return;
      const d = await resp.json();
      if (!d.success) return;
      state.pending = d.pending || [];
      state.active = d.active || null;
      // 仅当未加载过历史（或清空后）时用服务端历史覆盖；展开更多的结果保留在 state.older
      if (state.older.length === 0) {
        state.history = d.history || [];
      } else {
        // 首页历史中比 oldest older 新的部分更新，保留已展开的更早记录
        state.history = (d.history || []).filter(h => true);
      }
      state.canExpand = !!d.has_more || state.canExpand;
      if (state.nextCursor == null) state.nextCursor = state.canExpand ? (d.history && d.history.length ? d.history[d.history.length - 1].created_at : null) : null;
      render();
      // 若正在处理的任务尚未订阅，则订阅以续接流式输出（刷新重连）
      if (state.active && !subscribed.has(state.active.id)) {
        subscribe(state.active.id);
      }
    } catch (e) { /* 网络抖动忽略，下个周期重试 */ }
  }

  async function expandMore() {
    if (state.nextCursor == null) return;
    try {
      const resp = await api('/api/ai-chat/history?cursor=' + encodeURIComponent(state.nextCursor) + '&limit=10');
      const d = await resp.json();
      if (d.success && d.history && d.history.length) {
        // 更早的页面插到 older 前面（older 始终为“更旧”的一侧）
        state.older = d.history.concat(state.older);
        state.canExpand = !!d.has_more;
        state.nextCursor = d.has_more ? d.next_cursor : null;
        render();
      } else {
        state.canExpand = false;
        render();
      }
    } catch (e) { /* ignore */ }
  }

  // ---------- SSE 订阅 ----------
  async function subscribe(taskId) {
    if (subscribed.has(taskId)) return;
    subscribed.add(taskId);
    let acc = '';
    let stageAcc = [];
    let parts = [];      // 分阶段回复的有序片段：{k:'token'|'step', text}
    let running = false;
    // 拼装「分阶段进度 + 分阶段回复」的实时 HTML：进度列表（stageAcc）在上，下接按
    // 处理顺序穿插的「分阶段回复」片段——宿主各阶段结论（step）与模型流式分析（token）
    // 交错呈现，使「一条命令」的回答分多个阶段逐步展开，而非最后一次性抛出大段文本。
    const renderParts = function () {
      let h = '';
      let tokBuf = '';
      for (const p of parts) {
        if (p.k === 'token') { tokBuf += p.text; }
        else { h += renderContent(tokBuf); tokBuf = ''; h += '<div class="ai-step">' + esc(p.text) + '</div>'; }
      }
      h += renderContent(tokBuf);
      return h;
    };
    const renderLive = function () {
      let h = stageHtml(stageAcc, !running);
      const body = renderParts();
      h += body || '<div class="pending-hint">正在处理…</div>';
      // 缓存当前分阶段 HTML，供 2 秒轮询重绘时复用（renderMsgs 据此保持分阶段展示）
      liveRender[taskId] = h;
      return h;
    };
    try {
      const resp = await api('/api/ai-chat/tasks/' + encodeURIComponent(taskId) + '/stream');
      if (!resp.ok) { subscribed.delete(taskId); return; }
      const reader = resp.body.getReader();
      const decoder = new TextDecoder('utf-8');
      let buf = '';
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });
        let idx;
        while ((idx = buf.indexOf('\n\n')) !== -1) {
          const block = buf.slice(0, idx);
          buf = buf.slice(idx + 2);
          let ev = 'message', dataLines = [];
          block.split('\n').forEach(ln => {
            if (ln.startsWith('event:')) ev = ln.slice(6).trim();
            else if (ln.startsWith('data:')) dataLines.push(ln.slice(5).replace(/^ /, ''));
          });
          const data = dataLines.join('\n');
          if (ev === 'queued') {
            // 排队中：等待被处理
          } else if (ev === 'stage') {
            // 分阶段进度：追加一个阶段并刷新气泡顶部进度列表
            stageAcc.push(data);
            running = true;
            updateAiLive(taskId, renderLive(), true);
          } else if (ev === 'status' && data === 'running') {
            running = true;
            updateAiLive(taskId, renderLive(), true);
          } else if (ev === 'step') {
            // 分阶段回复：宿主在某处理阶段得出的可见结论，作为助手答复的一行呈现
            running = true;
            parts.push({ k: 'step', text: data });
            updateAiLive(taskId, renderLive(), true);
          } else if (ev === 'token') {
            running = true;
            acc += data;
            parts.push({ k: 'token', text: data });
            updateAiLive(taskId, renderLive(), true);
          } else if (ev === 'done') {
            // 若服务端回复为空（模型只执行了工具操作未产出文本），优先保留已流式输出的内容，
            // 否则回退为友好占位，避免聊天框出现空白气泡。
            const finalText = (data && data.trim()) ? data : (acc || '（任务已执行完成，无文本输出）');
            // 完成时保留分阶段进度列表（全部标记为 done），再附最终回复，使整轮处理过程可见。
            let h = stageHtml(stageAcc, true);
            h += renderContent(finalText);
            updateAiLive(taskId, h, false);
            subscribed.delete(taskId);
            delete liveRender[taskId];
            refresh();
            return;
          } else if (ev === 'error') {
            const node = document.getElementById('ai-' + taskId);
            if (node) { node.textContent = data; node.classList.add('err'); node.classList.remove('pending'); }
            subscribed.delete(taskId);
            delete liveRender[taskId];
            refresh();
            return;
          }
        }
      }
    } catch (e) {
      // 连接断开：标记未订阅，稍后由 refresh 重新订阅以续接
      subscribed.delete(taskId);
      delete liveRender[taskId];
    }
  }

  // ---------- 发送 ----------
  async function onSend() {
    const v = txt.value.trim();
    if (!v) return;
    if (!TOKEN) {
      TOKEN = readToken();
      if (!TOKEN) {
        window.parent.postMessage({ type: 'DBOX_REQUEST_TOKEN', extId: 'ai_chat' }, '*');
        for (let i = 0; i < 15 && !TOKEN; i++) { await new Promise(r => setTimeout(r, 100)); }
        if (!TOKEN) TOKEN = readToken();
      }
    }
    if (!TOKEN) { alert('尚未获取到管理员 token，请稍候重试或重新登录'); return; }

    txt.value = '';
    txt.style.height = 'auto';
    syncDraft();
    send.disabled = true;
    try {
      const resp = await api('/api/ai-chat', {
        method: 'POST',
        body: JSON.stringify({ message: v })
      });
      if (!resp.ok) {
        let msg = 'HTTP ' + resp.status;
        try { const d = await resp.json(); if (d && d.message) msg = d.message; } catch (e) {}
        alert('入队失败：' + msg);
        return;
      }
      const d = await resp.json();
      const taskId = d.task_id;
      // 立即刷新队列（任务进入 pending），并订阅其流式输出
      refresh();
      if (taskId) subscribe(taskId);
    } catch (e) {
      alert('入队失败：' + e.message);
    } finally {
      send.disabled = false;
    }
  }

  // ---------- 删除 / 取消 ----------
  async function deleteTask(taskId) {
    try {
      subscribed.delete(taskId);
      const resp = await api('/api/ai-chat/tasks/' + encodeURIComponent(taskId), { method: 'DELETE' });
      refresh();
    } catch (e) { /* ignore */ }
  }

  // ---------- 收起全部 / 展开全部 ----------
  function toggleAll() {
    if (collapsedAllMode) {
      // 展开全部：退出强制折叠，并把当前可见的长消息全部记入已展开，保持展开
      collapsedAllMode = false;
      msgs.querySelectorAll('.bubble.ai').forEach(n => {
        if (!n.classList.contains('running') && !n.classList.contains('pending')) expandedIds.add(n.id.slice(3));
      });
    } else {
      // 收起全部：强制折叠所有 AI 气泡，并清空已展开记录
      collapsedAllMode = true;
      expandedIds.clear();
    }
    renderMsgs();
  }

  // ---------- 清空对话 ----------
  clearBtn.addEventListener('click', async () => {
    if (!confirm('确定清空全部对话（含排队与历史）？')) return;
    try {
      subscribed.clear();
      expandedIds.clear();
      collapsedAllMode = false;
      Object.keys(liveRender).forEach(k => delete liveRender[k]);
      await api('/api/ai-chat/clear', { method: 'POST' });
      state = { pending: [], active: null, history: [], has_more: false, older: [], nextCursor: null, canExpand: false };
      render();
    } catch (e) { /* ignore */ }
  });

  send.addEventListener('click', onSend);
  toggleAllBtn.addEventListener('click', toggleAll);
  // 全屏对话：请求宿主跳转到 /ai-chat 独立页面（面板自身由宿主收起）；
  // 该页面的「返回」会经 DBOX_NAVIGATE '__back__' 回到悬浮面板所在页。
  if (fullscreenBtn) {
    fullscreenBtn.addEventListener('click', () => {
      window.parent.postMessage({ type: 'DBOX_NAVIGATE', path: '/ai-chat' }, '*');
    });
  }
  txt.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); onSend(); } });

  // 输入框随内容自动加高（单行起步，超过一行自动撑高，最高 200px 后内部滚动）
  const TXT_MAX_H = 200;
  function autoGrow() {
    txt.style.height = 'auto';
    txt.style.height = Math.min(txt.scrollHeight, TXT_MAX_H) + 'px';
  }
  // 实时把未发送的内容同步给宿主，收起面板（iframe 被销毁）后不会丢失
  function syncDraft() {
    window.parent.postMessage({ type: 'DBOX_DRAFT_SAVE', extId: 'ai_chat', text: txt.value }, '*');
  }
  txt.addEventListener('input', () => { autoGrow(); syncDraft(); });
  // 反馈单 / 资源引用点击：通知宿主（父页面）跳转；跳转后宿主会自动收起面板
  msgs.addEventListener('click', function (e) {
    const a = e.target.closest && e.target.closest('.fb-ref');
    if (a && a.dataset.id) {
      window.parent.postMessage({ type: 'DBOX_NAVIGATE', path: '/feedback/' + a.dataset.id }, '*');
      return;
    }
    const r = e.target.closest && e.target.closest('.res-ref');
    if (r && r.dataset.type && r.dataset.ref != null) {
      navigateResource(r);
    }
  });

  // 资源引用解析缓存（同一 (type,ref) 只请求一次）
  const refCache = {};
  function resolveResource(type, ref) {
    const key = type + '|' + ref;
    if (Object.prototype.hasOwnProperty.call(refCache, key)) return Promise.resolve(refCache[key]);
    return api('/api/ai-chat/resource-resolve?type=' + encodeURIComponent(type) + '&ref=' + encodeURIComponent(ref))
      .then(r => r.json()).then(d => { refCache[key] = d; return d; })
      .catch(() => ({ found: false }));
  }
  function navigateResource(el) {
    const type = el.dataset.type, ref = el.dataset.ref;
    const url = el.dataset.url;
    if (url) { window.parent.postMessage({ type: 'DBOX_NAVIGATE', path: url }, '*'); return; }
    resolveResource(type, ref).then(d => {
      if (d && d.found && d.url) { el.dataset.url = d.url; window.parent.postMessage({ type: 'DBOX_NAVIGATE', path: d.url }, '*'); }
    }).catch(() => {});
  }
  // 渲染后异步补全资源卡片的封面/标题/类型标签（已解析过的走缓存，不会重复请求）
  function enrichResourceRefs() {
    msgs.querySelectorAll('.res-ref').forEach(el => {
      const type = el.dataset.type, ref = el.dataset.ref;
      if (!type || ref == null) return;
      resolveResource(type, ref).then(d => {
        if (!d || !d.found) { el.classList.add('missing'); return; }
        el.classList.add('found');
        if (d.url) el.dataset.url = d.url;
        if (d.title) el.title = d.title;
        // 裸链接卡片的占位标题（.rr-title）回填为资源真实标题
        const ttl = el.querySelector('.rr-title');
        if (ttl && d.title) ttl.textContent = d.title;
        if (d.cover_url && !el.querySelector('.rr-cover')) {
          const img = document.createElement('img');
          img.className = 'rr-cover'; img.src = d.cover_url; img.alt = '';
          el.insertBefore(img, el.firstChild);
        }
        if (!el.querySelector('.rr-type')) {
          const tag = document.createElement('span');
          tag.className = 'rr-type'; tag.textContent = typeLabel(type);
          el.appendChild(tag);
        }
      }).catch(() => {});
    });
  }
  autoGrow();

  // 初始加载 + 周期性轮询（保持队列/状态/历史与后端一致；流式内容由 SSE 负责）
  refresh();
  pollTimer = setInterval(refresh, 2000);
</script>
</body>
</html>
