<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AI 助手</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Segoe UI", "PingFang SC", sans-serif; background: #f7f8fa; color: #1f2329; height: 100%; }
  .wrap { display: flex; flex-direction: column; height: 100vh; }
  .msgs { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  .bubble { max-width: 80%; padding: 8px 12px; border-radius: 12px; font-size: 14px; line-height: 1.5; word-break: break-word; }
  .me { align-self: flex-end; background: #4f8cff; color: #fff; border-bottom-right-radius: 4px; }
  .ai { align-self: flex-start; background: #e9ebf0; color: #1f2329; border-bottom-left-radius: 4px; }
  .input-bar { display: flex; gap: 8px; padding: 10px; border-top: 1px solid #e3e6eb; background: #fff; }
  .input-bar textarea { flex: 1; resize: none; height: 40px; border: 1px solid #d0d4dc; border-radius: 8px; padding: 8px 10px; font-size: 14px; font-family: inherit; }
  .input-bar button { background: #4f8cff; color: #fff; border: none; border-radius: 8px; padding: 0 16px; font-size: 14px; cursor: pointer; }
  .input-bar button:disabled { opacity: .5; cursor: not-allowed; }
  .hint { font-size: 12px; color: #888; padding: 6px 12px; }
  .toolbar { display: flex; justify-content: flex-end; padding: 4px 10px 0; }
  .toolbar button { background: none; border: 1px solid #d0d4dc; color: #888; border-radius: 6px; font-size: 12px; padding: 2px 8px; cursor: pointer; }
  .toolbar button:hover { color: #4f8cff; border-color: #4f8cff; }
</style>
</head>
<body>
<div class="wrap">
  <div class="toolbar"><button id="clear">清空对话</button></div>
  <div class="msgs" id="msgs"><div class="hint">使用管理员 token 经后端 /api/ai-chat 呼叫 AI 服务；历史记录已本地保存</div></div>
  <div class="input-bar">
    <textarea id="txt" placeholder="输入消息… (Enter 发送)"></textarea>
    <button id="send">发送</button>
  </div>
</div>
<script>
  // 面板 iframe 与宿主同源（sandbox 开启 allow-same-origin），
  // 优先直接读取 localStorage 中的 access token，避免 postMessage 注入竞态导致 token 为空触发 401。
  function readToken() {
    try {
      return localStorage.getItem('token')
        || localStorage.getItem('access_token')
        || sessionStorage.getItem('token') || '';
    } catch (e) { return ''; }
  }
  let TOKEN = readToken();
  window.addEventListener('message', (e) => {
    if (e.data && e.data.type === 'DBOX_TOKEN' && e.data.token) { TOKEN = e.data.token; }
  });
  // 向宿主请求 token（作为兜底，若直读失败再靠注入）
  window.parent.postMessage({ type: 'DBOX_REQUEST_TOKEN', extId: 'ai_chat' }, '*');

  const msgs = document.getElementById('msgs');
  const txt = document.getElementById('txt');
  const send = document.getElementById('send');
  const clearBtn = document.getElementById('clear');

  // 对话历史持久化到 localStorage：面板关闭/重开或刷新页面后仍能恢复，
  // 从而使 AI（后端 /api/ai-chat）能持续看到之前的聊天记录。
  const STORE_KEY = 'ai_chat_history';

  function loadHistory() {
    try {
      const raw = localStorage.getItem(STORE_KEY);
      if (!raw) return [];
      const arr = JSON.parse(raw);
      return Array.isArray(arr) ? arr : [];
    } catch (e) { return []; }
  }
  function saveHistory() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(history)); } catch (e) {}
  }

  // 本地维护对话历史，每次请求一并发给后端，使 AI 能看到之前的聊天记录
  let history = loadHistory();

  function addBubble(text, who) {
    const d = document.createElement('div');
    d.className = 'bubble ' + who;
    d.textContent = text;
    msgs.appendChild(d);
    msgs.scrollTop = msgs.scrollHeight;
  }

  // 恢复历史：清空初始提示后按顺序回放气泡
  function renderHistory() {
    const hint = msgs.querySelector('.hint');
    if (hint) hint.remove();
    history.forEach((h) => {
      if (h && (h.role === 'user' || h.role === 'assistant') && h.content) {
        addBubble(h.content, h.role === 'user' ? 'me' : 'ai');
      }
    });
  }
  renderHistory();
  if (history.length) msgs.scrollTop = msgs.scrollHeight;

  clearBtn.addEventListener('click', () => {
    history = [];
    saveHistory();
    msgs.innerHTML = '<div class="hint">对话已清空</div>';
  });

  async function callAI(prompt, history) {
    // 经后端 /api/ai-chat 调用 CodeBuddy CLI（后端用凭证保险库 token 调 CLI）
    // 本面板只需带管理员 JWT 通过 @admin_required 鉴权，并一并发上对话历史
    const headers = { 'Content-Type': 'application/json' };
    if (TOKEN) headers['Authorization'] = 'Bearer ' + TOKEN;
    const resp = await fetch('/api/ai-chat', {
      method: 'POST',
      headers: headers,
      body: JSON.stringify({ message: prompt, history: history })
    });
    const data = await resp.json().catch(() => ({}));
    if (!resp.ok || !data.success) {
      throw new Error(data.message || ('HTTP ' + resp.status));
    }
    return data.reply || '(空回复)';
  }

  async function onSend() {
    const v = txt.value.trim();
    if (!v) return;
    if (!TOKEN) {
      // 先尝试直读 localStorage，失败再依赖 postMessage 注入并短等
      TOKEN = readToken();
      if (!TOKEN) {
        window.parent.postMessage({ type: 'DBOX_REQUEST_TOKEN', extId: 'ai_chat' }, '*');
        for (let i = 0; i < 15 && !TOKEN; i++) { await new Promise(r => setTimeout(r, 100)); }
        if (!TOKEN) TOKEN = readToken();
      }
    }
    if (!TOKEN) { addBubble('尚未获取到管理员 token，请稍候重试或重新登录', 'ai'); return; }
    addBubble(v, 'me');
    history.push({ role: 'user', content: v });
    // 仅保留最近 20 条，避免历史无限增长拖慢响应
    if (history.length > 20) history = history.slice(-20);
    saveHistory();
    txt.value = '';
    send.disabled = true;
    try {
      // 历史中不含当前这一条，由后端附带在 prompt 末尾
      const reply = await callAI(v, history.slice(0, -1));
      addBubble(reply, 'ai');
      history.push({ role: 'assistant', content: reply });
      saveHistory();
    } catch (e) {
      // 调用失败则回滚刚加入的用户消息，避免脏历史影响后续对话
      history.pop();
      saveHistory();
      addBubble('调用失败: ' + e.message, 'ai');
    } finally {
      send.disabled = false;
    }
  }

  send.addEventListener('click', onSend);
  txt.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); onSend(); } });
</script>
</body>
</html>
