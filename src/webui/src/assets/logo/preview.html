<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>DBox Logo 方案预览</title>
<style>
  :root{
    --bg-base:#0d0d10; --bg-surface:#1a1a22; --border:rgba(255,255,255,.1);
    --text:#f4f4f7; --text-2:#b8b8c4; --accent:#7c5cff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg-base);color:var(--text);padding:40px 24px}
  h1{font-size:22px;font-weight:700;margin-bottom:6px}
  p.sub{color:var(--text-2);font-size:14px;margin-bottom:32px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px;max-width:1100px}
  .card{background:var(--bg-surface);border:1px solid var(--border);border-radius:16px;padding:28px;display:flex;flex-direction:column;align-items:center;gap:16px;transition:.2s}
  .card:hover{border-color:rgba(124,92,255,.45);transform:translateY(-3px)}
  .card .ico{height:120px;width:120px;display:flex;align-items:center;justify-content:center}
  .card .ico img{width:120px;height:auto}
  .card .name{font-size:15px;font-weight:600}
  .card .desc{font-size:12px;color:var(--text-2);text-align:center;line-height:1.5}
  .tag{font-size:11px;padding:2px 10px;border-radius:999px;background:rgba(124,92,255,.14);color:#b08cff}
</style>
</head>
<body>
  <h1>DBox Logo 设计方案</h1>
  <p class="sub">共 6 套方案，点击卡片可在新标签查看大图。请挑选你喜欢的方向。</p>
  <div class="grid">
    <div class="card"><div class="ico"><img src="logo-gradient-d.svg"></div><div class="name">① 渐变方块 D</div><div class="desc">现代几何，品牌色渐变填充<span class="tag">推荐·通用</span></div></div>
    <div class="card"><div class="ico"><img src="logo-play-d.svg"></div><div class="name">② 播放三角 D</div><div class="desc">圆形底嵌套双播放三角，强影视语义</div></div>
    <div class="card"><div class="ico"><img src="logo-line-d.svg"></div><div class="name">③ 极简线条 D</div><div class="desc">线性描边轻奢风，适合极简界面</div></div>
    <div class="card"><div class="ico"><img src="logo-neon-d.svg"></div><div class="name">④ 霓虹光晕 D</div><div class="desc">暗色科技感发光，契合当前暗色主题</div></div>
    <div class="card"><div class="ico"><img src="logo-film-d.svg"></div><div class="name">⑤ 胶片帧 D</div><div class="desc">胶片齿孔造型，突出影音属性</div></div>
  </div>
</body>
</html>
